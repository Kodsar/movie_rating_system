services:
  db:
    image: postgres:16
    container_name: movie_db
    environment:
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepass
      POSTGRES_DB: moviedb
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - .:/app   # <-- add this

  api:
    build: .
    container_name: movie_api
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8002:8000"
    volumes:
      - .:/app
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  pgdata:
